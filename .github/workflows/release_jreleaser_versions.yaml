name: release with jreleaser using versiosn

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4.7.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.3.1
      - name: Build with Gradle
        run: ./gradlew shadowJar

      # Docker
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker_meta
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: codepitbull/hello
          tags: type=raw,value=latest

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generate Docker SBOM
        id: docker-sbom
        uses: anchore/sbom-action@v1.18.0
        with:
          artifact-name: docker-sbom.spdx
          output-file: docker-sbom.spdx

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign image with a key
        run: |
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "${TAGS}@${DIGEST}"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_KEY_PASSWORD }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}

      # JReleaser
      - name: Run JReleaser
        uses: jreleaser/release-action@v2.4.2
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
